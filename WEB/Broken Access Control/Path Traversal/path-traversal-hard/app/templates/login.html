{% extends "base.html" %}
{% block body %}
<div class="login-wrap">
  <div class="login-box">
    <div class="login-logo">
      <svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
        <rect width="40" height="40" rx="6" fill="#0f172a"/>
        <path d="M10 28 L20 12 L30 28 Z" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round"/>
        <circle cx="20" cy="22" r="2.5" fill="#38bdf8"/>
      </svg>
    </div>
    <h1>Cobalt Archive</h1>
    <p class="subtitle">Sign in to access your documents</p>

    {% if error %}
    <div class="alert">{{ error }}</div>
    {% endif %}

    <form method="post" action="/login">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required autofocus>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>

      <button type="submit" class="btn btn-primary">Sign In</button>
    </form>
  </div>
</div>
{% endblock %}
