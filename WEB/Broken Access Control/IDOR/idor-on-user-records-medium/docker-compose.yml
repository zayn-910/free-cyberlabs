name: willow-creek-clinic-lab

services:
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    image: willow-creek-patient-portal:1.0.0
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      PORTAL_DATA_DIR: /data
    volumes:
      - portal_data:/data
    networks:
      - portal_net
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 512m
    cpus: 0.50
    pids_limit: 128
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  portal_data:
    name: willow-creek-clinic-lab-data

networks:
  portal_net:
    name: willow-creek-clinic-lab-net
    driver: bridge
    internal: false
