name: package-labs


on:
  push:
    branches: [main]
    paths:
      - "WEB/**"
      - "NETWORK/**"
      - "tools/package-lab.sh"
      - ".github/workflows/package-labs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build one ZIP per lab
        run: |
          python3 - <<'PY'
          import pathlib

          paths = sorted(
              str(p.parent)
              for p in pathlib.Path(".").rglob("lab.yml")
              if "templates" not in p.parts and ".git" not in p.parts
          )
          if not paths:
              raise SystemExit("no labs found (no lab.yml files in the repository)")
          pathlib.Path("/tmp/lab-paths.txt").write_text("\n".join(paths) + "\n", encoding="utf-8")
          print(f"Packaging {len(paths)} labs:")
          print("\n".join(paths))
          PY
          while IFS= read -r lab_path || [ -n "$lab_path" ]; do
            [ -n "$lab_path" ] || continue
            sh tools/package-lab.sh "$lab_path" dist
          done < /tmp/lab-paths.txt
          ls -lh dist

      - name: Replace the assets on the permanent latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Recreate the release each time so removed/renamed labs do not
          # leave stale ZIPs behind.
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/*.zip \
            --title "Latest labs" \
            --notes "Automatically updated on every push to main. Download the ZIP for the lab you want, unzip it, and run: docker compose up -d --build" \
            --prerelease
